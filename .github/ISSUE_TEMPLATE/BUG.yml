name: OH NO, I GET BUG IN SOUP!
description: 'Report a bug'
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: extra-info
    attributes:
      label: Extra information
      description: Is there anything else we should know?
      placeholder: |
        - OS: [e.g. Windows 10]
        - Python version: [e.g. 3.9.13]
        - VirtualPyDetector version: [e.g. 1.0.0]
        - Other: [e.g. any other information]
    validations:
      required: false